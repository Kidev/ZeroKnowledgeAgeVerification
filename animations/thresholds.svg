<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="540" fill="#0e1420"/>
  <rect width="0" height="0" fill="none">
    <animate id="cy" attributeName="x" from="0" to="0" dur="33.9s" begin="0s;cy.end"/>
  </rect>

  <text x="480" y="42" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600">One list per age threshold, one bit per site</text>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+1s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <rect x="50" y="80" width="280" height="240" rx="12" fill="#141d2e" stroke="#475569" stroke-width="2"/>
    <text x="190" y="110" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="600">Government lists</text>
    <text x="190" y="132" fill="#94a3b8" font-size="13" text-anchor="middle">One signed list per threshold</text>
    <text x="120" y="163" fill="#60a5fa" font-size="12" text-anchor="middle" font-weight="600">13+</text>
    <line x1="120" y1="178" x2="96" y2="206" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="178" r="9" fill="#60a5fa"/>
    <circle cx="96" cy="206" r="7" fill="#475569"/>
    <text x="190" y="163" fill="#2dd4bf" font-size="12" text-anchor="middle" font-weight="600">15+</text>
    <line x1="190" y1="178" x2="166" y2="206" stroke="#334155" stroke-width="1.5"/>
    <circle cx="190" cy="178" r="9" fill="#2dd4bf"/>
    <circle cx="166" cy="206" r="7" fill="#475569"/>
    <text x="260" y="163" fill="#a78bfa" font-size="12" text-anchor="middle" font-weight="600">18+</text>
    <line x1="260" y1="178" x2="236" y2="206" stroke="#334155" stroke-width="1.5"/>
    <circle cx="260" cy="178" r="9" fill="#a78bfa"/>
    <circle cx="236" cy="206" r="7" fill="#475569"/>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+3.2s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <line x1="120" y1="178" x2="120" y2="178" stroke="#334155" stroke-width="1.5">
      <set attributeName="x2" to="120" begin="cy.begin"/>
      <set attributeName="y2" to="178" begin="cy.begin"/>
      <animate attributeName="x2" from="120" to="120" dur="0.4s" begin="cy.begin+3.2s" fill="freeze"/>
      <animate attributeName="y2" from="178" to="206" dur="0.4s" begin="cy.begin+3.2s" fill="freeze"/>
    </line>
    <circle cx="120" cy="178" r="9" fill="#60a5fa"/>
    <circle cx="120" cy="206" r="7" fill="#fbbf24" opacity="0">
      <set attributeName="opacity" to="0" begin="cy.begin"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+3.6s" fill="freeze"/>
      <animate attributeName="r" values="7;11;7" dur="0.5s" begin="cy.begin+3.6s"/>
    </circle>
    <circle cx="76" cy="240.5" r="5.5" fill="#fbbf24"/><path d="M 67.2 259 a 8.8 8.8 0 0 1 17.6 0 z" fill="#fbbf24"/>
    <text x="96" y="255" fill="#e5e7eb" font-size="12">Zoe, 14: on the 13+ list only</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+4.9s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <line x1="120" y1="178" x2="120" y2="178" stroke="#334155" stroke-width="1.5">
      <set attributeName="x2" to="120" begin="cy.begin"/>
      <set attributeName="y2" to="178" begin="cy.begin"/>
      <animate attributeName="x2" from="120" to="144" dur="0.4s" begin="cy.begin+4.9s" fill="freeze"/>
      <animate attributeName="y2" from="178" to="206" dur="0.4s" begin="cy.begin+4.9s" fill="freeze"/>
    </line>
    <circle cx="120" cy="178" r="9" fill="#60a5fa"/>
    <circle cx="144" cy="206" r="7" fill="#4ade80" opacity="0">
      <set attributeName="opacity" to="0" begin="cy.begin"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+5.3s" fill="freeze"/>
      <animate attributeName="r" values="7;11;7" dur="0.5s" begin="cy.begin+5.3s"/>
    </circle>
    <line x1="190" y1="178" x2="190" y2="178" stroke="#334155" stroke-width="1.5">
      <set attributeName="x2" to="190" begin="cy.begin"/>
      <set attributeName="y2" to="178" begin="cy.begin"/>
      <animate attributeName="x2" from="190" to="214" dur="0.4s" begin="cy.begin+4.9s" fill="freeze"/>
      <animate attributeName="y2" from="178" to="206" dur="0.4s" begin="cy.begin+4.9s" fill="freeze"/>
    </line>
    <circle cx="190" cy="178" r="9" fill="#2dd4bf"/>
    <circle cx="214" cy="206" r="7" fill="#4ade80" opacity="0">
      <set attributeName="opacity" to="0" begin="cy.begin"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+5.3s" fill="freeze"/>
      <animate attributeName="r" values="7;11;7" dur="0.5s" begin="cy.begin+5.3s"/>
    </circle>
    <line x1="260" y1="178" x2="260" y2="178" stroke="#334155" stroke-width="1.5">
      <set attributeName="x2" to="260" begin="cy.begin"/>
      <set attributeName="y2" to="178" begin="cy.begin"/>
      <animate attributeName="x2" from="260" to="284" dur="0.4s" begin="cy.begin+4.9s" fill="freeze"/>
      <animate attributeName="y2" from="178" to="206" dur="0.4s" begin="cy.begin+4.9s" fill="freeze"/>
    </line>
    <circle cx="260" cy="178" r="9" fill="#a78bfa"/>
    <circle cx="284" cy="206" r="7" fill="#4ade80" opacity="0">
      <set attributeName="opacity" to="0" begin="cy.begin"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+5.3s" fill="freeze"/>
      <animate attributeName="r" values="7;11;7" dur="0.5s" begin="cy.begin+5.3s"/>
    </circle>
    <circle cx="76" cy="278.5" r="5.5" fill="#4ade80"/><path d="M 67.2 297 a 8.8 8.8 0 0 1 17.6 0 z" fill="#4ade80"/>
    <text x="96" y="293" fill="#e5e7eb" font-size="12">Sam, 30: all three, same secret</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+6.6s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <rect x="360" y="80" width="260" height="240" rx="12" fill="#141d2e" stroke="#4ade80" stroke-width="2"/>
    <text x="490" y="110" fill="#4ade80" font-size="16" text-anchor="middle" font-weight="600">The honest check</text>
    <text x="490" y="140" fill="#e5e7eb" font-size="13" text-anchor="middle">A 13+ site verifies proofs</text>
    <text x="490" y="160" fill="#e5e7eb" font-size="13" text-anchor="middle">against the 13+ list only</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+9.1s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <text x="490" y="192" fill="#94a3b8" font-size="13" text-anchor="middle">It learns exactly one bit,</text>
    <text x="490" y="212" fill="#94a3b8" font-size="13" text-anchor="middle">“old enough”, never an age</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+11.3s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <circle cx="420" cy="241" r="7" fill="#fbbf24"/><path d="M 408.8 261 a 11.2 11.2 0 0 1 22.4 0 z" fill="#fbbf24"/>
    <circle cx="462" cy="252" r="14" fill="none" stroke="#4ade80" stroke-width="3"/><path d="M 455 252 l 5 6 l 10 -12" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="441" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">Zoe, 14</text>
    <circle cx="520" cy="241" r="7" fill="#4ade80"/><path d="M 508.8 261 a 11.2 11.2 0 0 1 22.4 0 z" fill="#4ade80"/>
    <circle cx="562" cy="252" r="14" fill="none" stroke="#4ade80" stroke-width="3"/><path d="M 555 252 l 5 6 l 10 -12" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="541" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">Sam, 30</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+12.2s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <rect x="650" y="80" width="260" height="240" rx="12" fill="#141d2e" stroke="#f87171" stroke-width="2"/>
    <text x="780" y="110" fill="#f87171" font-size="16" text-anchor="middle" font-weight="600">The probe</text>
    <text x="780" y="140" fill="#e5e7eb" font-size="13" text-anchor="middle">The same site retests those</text>
    <text x="780" y="160" fill="#e5e7eb" font-size="13" text-anchor="middle">proofs against the 18+ list</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+14.1s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <text x="780" y="192" fill="#94a3b8" font-size="13" text-anchor="middle">Each proof is welded to 13+:</text>
    <text x="780" y="212" fill="#94a3b8" font-size="13" text-anchor="middle">it fails for both, 14 or 30</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+16.7s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <circle cx="710" cy="241" r="7" fill="#fbbf24"/><path d="M 698.8 261 a 11.2 11.2 0 0 1 22.4 0 z" fill="#fbbf24"/>
    <circle cx="752" cy="252" r="14" fill="none" stroke="#f87171" stroke-width="3"/><line x1="744" y1="244" x2="760" y2="260" stroke="#f87171" stroke-width="3"/><line x1="760" y1="244" x2="744" y2="260" stroke="#f87171" stroke-width="3"/>
    <text x="731" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">Zoe, 14</text>
    <circle cx="810" cy="241" r="7" fill="#4ade80"/><path d="M 798.8 261 a 11.2 11.2 0 0 1 22.4 0 z" fill="#4ade80"/>
    <circle cx="852" cy="252" r="14" fill="none" stroke="#f87171" stroke-width="3"/><line x1="844" y1="244" x2="860" y2="260" stroke="#f87171" stroke-width="3"/><line x1="860" y1="244" x2="844" y2="260" stroke="#f87171" stroke-width="3"/>
    <text x="831" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">Sam, 30</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+17.6s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <rect x="50" y="345" width="570" height="145" rx="12" fill="#141d2e" stroke="#fbbf24" stroke-width="2"/>
    <text x="335" y="375" fill="#fbbf24" font-size="16" text-anchor="middle" font-weight="600">“Prove 18+ instead”, the site then asks your wallet</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+19s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <text x="335" y="405" fill="#e5e7eb" font-size="13" text-anchor="middle">Your wallet shows what the site checks</text>
    <text x="335" y="425" fill="#e5e7eb" font-size="13" text-anchor="middle">and remembers it declared 13+</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+21.4s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <text x="335" y="452" fill="#94a3b8" font-size="13" text-anchor="middle">The same warning appears at 14 and at 30,</text>
    <text x="335" y="472" fill="#94a3b8" font-size="13" text-anchor="middle">and nothing proceeds without your explicit consent</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+25.4s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <rect x="650" y="345" width="260" height="145" rx="12" fill="#141d2e" stroke="#4ade80" stroke-width="2"/>
    <text x="780" y="375" fill="#4ade80" font-size="16" text-anchor="middle" font-weight="600">By construction</text>
    <text x="780" y="407" fill="#e5e7eb" font-size="13" text-anchor="middle">One threshold per site</text>
    <text x="780" y="432" fill="#e5e7eb" font-size="13" text-anchor="middle">One bit per proof</text>
    <text x="780" y="457" fill="#e5e7eb" font-size="13" text-anchor="middle">One use per token</text>
  </g>

  <text x="480" y="520" fill="#94a3b8" font-size="14" text-anchor="middle" opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="cy.begin+28s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    Enforced by mathematics, not by trust: any probing attempt lands on your screen, not behind your back.
  </text>
</svg>
