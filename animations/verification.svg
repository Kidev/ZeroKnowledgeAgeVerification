  </rect>

  <text x="480" y="42" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600">Proving adulthood: local mathematics, verified offline</text>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+1s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <rect x="60" y="110" width="250" height="220" rx="12" fill="#141d2e" stroke="#4ade80" stroke-width="2"/>
    <text x="185" y="140" fill="#4ade80" font-size="17" text-anchor="middle" font-weight="600">Wallet</text>
    <text x="185" y="165" fill="#94a3b8" font-size="13" text-anchor="middle">Holds secret s and the public tree</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+2.5s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <rect x="650" y="110" width="250" height="220" rx="12" fill="#141d2e" stroke="#60a5fa" stroke-width="2"/>
    <text x="775" y="140" fill="#60a5fa" font-size="17" text-anchor="middle" font-weight="600">Website</text>
    <text x="775" y="165" fill="#94a3b8" font-size="13" text-anchor="middle">Holds only the signed root</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+4s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="cy.begin+8.9s" fill="freeze"/>
    <line x1="640" y1="180" x2="330" y2="180" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrb)"/>
    <rect x="410" y="158" width="150" height="26" rx="13" fill="#1e293b"/>
    <text x="485" y="176" fill="#60a5fa" font-size="13" text-anchor="middle">Fresh nonce n</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+4.9s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <text x="185" y="200" fill="#e5e7eb" font-size="14" text-anchor="middle">Proves in zero knowledge:</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+5.9s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <text x="90" y="226" fill="#e5e7eb" font-size="13">&#8226; My leaf is under the root</text>
    <text x="90" y="248" fill="#e5e7eb" font-size="13">&#8226; k derives from my secret</text>
  </g>

  <circle cx="185" cy="290" r="16" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="60 40" opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="cy.begin+4.9s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="cy.begin+8.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate" from="0 185 290" to="1080 185 290" dur="4s" begin="cy.begin+4.9s"/>
  </circle>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+8.9s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="cy.begin+11.1s" fill="freeze"/>
    <line x1="320" y1="255" x2="640" y2="255" stroke="#4ade80" stroke-width="2" marker-end="url(#arrg)"/>
    <rect x="380" y="233" width="210" height="26" rx="13" fill="#1e293b"/>
    <text x="485" y="251" fill="#4ade80" font-size="13" text-anchor="middle">Token (k, proof) bound to n</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+9.8s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <text x="775" y="230" fill="#e5e7eb" font-size="14" text-anchor="middle">Verifies locally against the root</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+11.1s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <circle cx="700" cy="280" r="16" fill="#4ade80"/>
    <path d="M692 280 l6 6 l11 -12" stroke="#0e1420" stroke-width="3.5" fill="none"/>
    <text x="726" y="277" fill="#e5e7eb" font-size="14">Adult: yes</text>
    <text x="726" y="296" fill="#94a3b8" font-size="12">Pseudonym k, this site only</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="cy.begin+12.5s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <rect x="355" y="380" width="250" height="110" rx="12" fill="#141d2e" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="480" y="412" fill="#94a3b8" font-size="16" text-anchor="middle" font-weight="600">Government</text>
    <text x="480" y="438" fill="#94a3b8" font-size="13" text-anchor="middle">Not contacted, not notified</text>
    <text x="480" y="460" fill="#94a3b8" font-size="13" text-anchor="middle">Structurally absent from this flow</text>
  </g>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cy.begin+15.1s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    <g stroke="#f87171" stroke-width="2.5">
      <line x1="185" y1="335" x2="420" y2="378"/>
      <line x1="775" y1="335" x2="540" y2="378"/>
      <line x1="285" y1="345" x2="315" y2="375"/><line x1="315" y1="345" x2="285" y2="375"/>
      <line x1="645" y1="345" x2="675" y2="375"/><line x1="675" y1="345" x2="645" y2="375"/>
    </g>
  </g>

  <text x="480" y="520" fill="#94a3b8" font-size="14" text-anchor="middle" opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="cy.begin+16s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+20.4s" fill="freeze"/>
    No verification traffic exists. A message never sent cannot be logged, correlated, or subpoenaed.
  </text>
</svg>
