    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <text x="780" y="192" fill="#94a3b8" font-size="13" text-anchor="middle">Chaque preuve est soudée au 13+ :</text>
    <text x="780" y="212" fill="#94a3b8" font-size="13" text-anchor="middle">elle échoue pour les deux, 14 ou 30</text>
