    <line x1="120" y1="178" x2="96" y2="206" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="178" r="9" fill="#60a5fa"/>
    <circle cx="96" cy="206" r="7" fill="#475569"/>
