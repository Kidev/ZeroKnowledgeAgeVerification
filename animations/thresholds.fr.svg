    <text x="780" y="375" fill="#4ade80" font-size="16" text-anchor="middle" font-weight="600">Par construction</text>
    <text x="780" y="407" fill="#e5e7eb" font-size="13" text-anchor="middle">Un seuil par site</text>
    <text x="780" y="432" fill="#e5e7eb" font-size="13" text-anchor="middle">Un bit par preuve</text>
    <text x="780" y="457" fill="#e5e7eb" font-size="13" text-anchor="middle">Un usage par jeton</text>
  </g>

  <text x="480" y="520" fill="#94a3b8" font-size="14" text-anchor="middle" opacity="0">
    <set attributeName="opacity" to="0" begin="cy.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="cy.begin+28s" fill="freeze"/>
    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    Garanti par les mathématiques, pas par la confiance : toute tentative de sondage atterrit sur votre écran, pas dans votre dos.
