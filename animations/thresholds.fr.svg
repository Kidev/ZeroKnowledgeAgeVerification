    <animate attributeName="opacity" to="0" dur="0.6s" begin="cy.begin+32.9s" fill="freeze"/>
    <rect x="50" y="80" width="280" height="240" rx="12" fill="#141d2e" stroke="#475569" stroke-width="2"/>
    <text x="190" y="110" fill="#e5e7eb" font-size="16" text-anchor="middle" font-weight="600">Listes du gouvernement</text>
    <text x="190" y="132" fill="#94a3b8" font-size="13" text-anchor="middle">Une liste signée par seuil</text>
