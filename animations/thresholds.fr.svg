    <text x="441" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">Zoé, 14 ans</text>
    <circle cx="520" cy="241" r="7" fill="#4ade80"/><path d="M 508.8 261 a 11.2 11.2 0 0 1 22.4 0 z" fill="#4ade80"/>
    <circle cx="562" cy="252" r="14" fill="none" stroke="#4ade80" stroke-width="3"/><path d="M 555 252 l 5 6 l 10 -12" fill="none" stroke="#4ade80" stroke-width="3"/>
