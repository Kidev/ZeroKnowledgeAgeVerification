<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="540" fill="#0e1420"/>
  <rect width="0" height="0" fill="none">
    <animate id="cy" attributeName="x" from="0" to="0" dur="33.9s" begin="0s;cy.end"/>
  </rect>

  <text x="480" y="42" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600">Une liste par seuil d'âge, un bit par site</text>

